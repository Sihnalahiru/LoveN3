<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My N3 Dream - Japanese Learning PWA</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(25, 26, 35, 0.75);
            --accent-green: #ccff00;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --gradient-primary: linear-gradient(135deg, #635bff 0%, #3a2ec9 100%);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: radial-gradient(circle at top, #1a1b26 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Welcome / Profile Select Screen */
        .welcome-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .welcome-screen h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-screen p {
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-size: 14px;
        }

        .profile-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .profile-choice {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 18px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .profile-choice:hover, .profile-choice.selected {
            border-color: var(--accent-green);
            transform: scale(1.05);
        }

        .profile-choice img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 8px;
            border: 2px solid var(--accent-green);
        }

        .profile-choice span {
            font-size: 14px;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            max-width: 280px;
            padding: 14px;
            background-color: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:active { transform: scale(0.96); }

        /* Dashboard Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-greeting h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .user-greeting span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .profile-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            cursor: pointer;
            object-fit: cover;
        }

        /* Glassmorphism Dashboard Card */
        .dash-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .progress-box {
            background: var(--gradient-primary);
            border-radius: 16px;
            padding: 18px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-box h3 {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.9;
        }

        .progress-box .value {
            font-size: 32px;
            font-weight: 800;
        }

        /* Module Grid */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .module-item {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .module-item:active { transform: scale(0.95); }

        .module-item span {
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            display: block;
        }

        /* Modal Popup (Admin Reset with Passcode 901001) */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #15161e;
            border: var(--glass-border);
            padding: 24px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }

        .modal-content h3 { margin-bottom: 15px; font-size: 18px; }

        .input-field {
            width: 100%;
            max-width: 280px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }

        .modal-btns { display: flex; gap: 10px; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 16, 20, 0.9);
            backdrop-filter: blur(10px);
            border-top: var(--glass-border);
            padding: 12px 0;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            text-align: center;
        }
        .nav-item.active { color: var(--accent-green); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. Welcome / Profile Selection Screen -->
        <div id="screen-welcome" class="screen active welcome-screen">
            <h1>My N3 Dream</h1>
            <p>ඔබේ ගමන ආරම්භ කිරීමට ඔබේ profile එක තෝරන්න:</p>
            
            <div class="profile-selection">
                <div class="profile-choice" onclick="selectProfile('නදීෂා', 'assets/nadeesha.png')" id="choice-nadeesha">
                    <img src="assets/nadeesha.png" alt="නදීෂා" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop'">
                    <span>නදීෂා</span>
                </div>
                <div class="profile-choice" onclick="selectProfile('සුදුනෝ', 'assets/suduno.png')" id="choice-suduno">
                    <img src="assets/suduno.png" alt="සුදුනෝ" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop'">
                    <span>සුදුනෝ</span>
                </div>
            </div>

            <button class="btn" onclick="handleLogin()">ඇප් එකට ඇතුළු වන්න</button>
        </div>

        <!-- 2. Main Dashboard Screen -->
        <div id="screen-dashboard" class="screen">
            <div class="header">
                <div class="user-greeting">
                    <span>සුභ දවසක්,</span>
                    <h2 id="display-username">User</h2>
                </div>
                <img id="header-avatar" src="" class="profile-avatar" onclick="openResetModal()" title="Settings / Reset">
            </div>

            <!-- Progress Box -->
            <div class="progress-box">
                <div>
                    <h3>Overall Progress</h3>
                    <div class="value" id="overall-progress">12%</div>
                </div>
                <div style="text-align: right;">
                    <h3>Streak</h3>
                    <div class="value" style="color: var(--accent-green);">🔥 3 Days</div>
                </div>
            </div>

            <!-- Module Grid -->
            <div class="module-grid">
                <div class="module-item" onclick="alert('Alphabet Module')">🔤<span>Alphabet</span></div>
                <div class="module-item" onclick="alert('Kanji Module')">⛩️<span>Kanji</span></div>
                <div class="module-item" onclick="alert('Vocabulary Module')">📖<span>Vocab</span></div>
                <div class="module-item" onclick="alert('Grammar Module')">📝<span>Grammar</span></div>
                <div class="module-item" onclick="alert('Reading Module')">📄<span>Reading</span></div>
                <div class="module-item" onclick="alert('Listening Module')">🎧<span>Listening</span></div>
            </div>
        </div>

        <!-- Secure Admin Reset Modal (Passcode: 901001) -->
        <div id="reset-modal" class="modal-overlay">
            <div class="modal-content">
                <h3>Admin Reset Data</h3>
                <p style="font-size:12px; color:var(--text-secondary); margin-bottom:15px;">දත්ත නැවත සැකසීමට රහස් අංකය (901001) ඇතුළත් කරන්න.</p>
                <input type="password" id="admin-passcode" class="input-field" placeholder="Passcode">
                <div class="modal-btns">
                    <button class="btn btn-cancel" onclick="closeResetModal()">අවලංගු</button>
                    <button class="btn" onclick="verifyAndReset()">Reset</button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <button class="nav-item active">🏠 Home</button>
            <button class="nav-item" onclick="alert('Exam Mode')">⚡ N3 Exam</button>
            <button class="nav-item" onclick="alert('Bookmarks')">🔖 Bookmarks</button>
            <button class="nav-item" onclick="openResetModal()">⚙️ Settings</button>
        </div>

    </div>

    <script>
        let selectedName = '';
        let selectedAvatar = '';

        function selectProfile(name, avatarPath) {
            selectedName = name;
            selectedAvatar = avatarPath;
            document.querySelectorAll('.profile-choice').forEach(el => el.classList.remove('selected'));
            if(name === 'නදීෂා') {
                document.getElementById('choice-nadeesha').classList.add('selected');
            } else {
                document.getElementById('choice-suduno').classList.add('selected');
            }
        }

        window.onload = function() {
            const savedName = localStorage.getItem('n3_username');
            const savedAvatar = localStorage.getItem('n3_avatar');
            if (savedName) {
                document.getElementById('display-username').innerText = savedName;
                document.getElementById('header-avatar').src = savedAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop';
                showScreen('screen-dashboard');
            } else {
                // Default select first
                selectProfile('නදීෂා', 'assets/nadeesha.png');
            }
        };

        function handleLogin() {
            if (selectedName) {
                localStorage.setItem('n3_username', selectedName);
                localStorage.setItem('n3_avatar', selectedAvatar);
                document.getElementById('display-username').innerText = selectedName;
                document.getElementById('header-avatar').src = selectedAvatar;
                playSFX();
                showScreen('screen-dashboard');
            } else {
                alert('කරුණාකර Profile එකක් තෝරන්න.');
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openResetModal() {
            document.getElementById('reset-modal').style.display = 'flex';
        }

        function closeResetModal() {
            document.getElementById('reset-modal').style.display = 'none';
            document.getElementById('admin-passcode').value = '';
        }

        function verifyAndReset() {
            const passcode = document.getElementById('admin-passcode').value;
            if (passcode === '901001') {
                localStorage.clear();
                alert('සියලු දත්ත සාර්ථකව මකා දමන ලදී (Reset Successful).');
                location.reload();
            } else {
                alert('වැරදි රහස් අංකයකි! (Invalid Passcode: 901001)');
            }
        }

        function playSFX() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }
    </script>
</body>
</html>
